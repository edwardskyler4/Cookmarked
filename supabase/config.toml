project_id = "cookmarked"

# Keep local Auth password validation aligned with the hosted project.
[auth]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

# This endpoint authenticates credentials itself; callers do not have a session yet.
[functions.auth]
verify_jwt = false

# Recipe operations require a valid Supabase Auth JWT.
[functions.recipes]
verify_jwt = true

# The handler validates the bearer JWT with Auth before any database operation.
[functions.recipes_save]
verify_jwt = false
