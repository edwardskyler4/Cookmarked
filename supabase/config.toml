project_id = "cookmarked"

# Keep local Auth password validation aligned with the hosted project.
[auth]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

# This endpoint authenticates credentials itself; callers do not have a session yet.
[functions.auth]
verify_jwt = false

# Gateway verification plus a shared verified-user boundary protect recipe calls.
[functions.recipes]
verify_jwt = true

# The shared boundary also verifies the user with Auth before any database operation.
[functions.recipes_save]
verify_jwt = true

# Metadata requests validate the bearer JWT inside the handler.
[functions.recipe_metadata]
verify_jwt = true

# Gateway verification supplements the shared verified-user boundary.
[functions.temp_recipes]
verify_jwt = true
