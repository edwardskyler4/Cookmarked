project_id = "cookmarked"

# Keep local Auth password validation aligned with the hosted project.
[auth]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

# This endpoint authenticates credentials itself; callers do not have a session yet.
[functions.auth]
verify_jwt = false

# Recipe handlers validate the bearer JWT with Auth, after handling CORS.
[functions.recipes]
verify_jwt = false

# The handler validates the bearer JWT with Auth before any database operation.
[functions.recipes_save]
verify_jwt = false

# Metadata requests validate the bearer JWT inside the handler.
[functions.recipe_metadata]
verify_jwt = false

# Temporary recipe operations use the same handler-owned token verification.
[functions.temp_recipes]
verify_jwt = false
